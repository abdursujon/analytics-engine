name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit and integration tests
        run: ./gradlew test

      - name: Build jar
        run: ./gradlew bootJar

      - name: Build Docker image
        run: docker build -t analytics-engine:${{ github.sha }} .

      - uses: actions/upload-artifact@v4
        with:
          name: analytics-engine-jar
          path: build/libs/analytics-engine.jar

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: analytics-engine-jar
          path: build/libs

      - name: Copy jar and Dockerfile to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/analytics-engine.jar,Dockerfile"
          target: "~/analytics-engine"

      - name: Rebuild and restart container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/analytics-engine
            docker build -t analytics-engine:latest .
            docker rm -f analytics-engine || true
            docker run -d --name analytics-engine --network web --restart unless-stopped analytics-engine:latest
            docker image prune -f

      - name: Verify health check
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "https://analytics-engine.duckdns.org/actuator/health" | grep -q '"UP"'; then
              echo "Deployment healthy"; exit 0
            fi
            sleep 5
          done
          echo "Health check failed"; exit 1
